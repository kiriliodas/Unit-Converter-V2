# Builds are expected to run in Android Studio / CI, not in the constrained
# source-authoring sandbox. 2 GB is the conventional Android Studio project
# setting; reduce it in a user-level gradle.properties if a machine needs to.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
